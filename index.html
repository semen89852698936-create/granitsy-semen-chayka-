<script>

function cIcon(cat){return CATEGORIES.find(c=>c.name===cat)?.icon||'◉'}
function scenario(id){return SCENARIOS.find(s=>s.id===Number(id))}
function catCount(name){return SCENARIOS.filter(s=>s.category===name).length}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}
function stats(){const records=Object.values(saved.records);const n=records.length;const choices=records.flatMap(r=>r.choices||[]);const firm=choices.filter(x=>x.style==='firm').length;return {n,total:SCENARIOS.length,choices:choices.length,firm,percent:choices.length?Math.round(firm/choices.length*100):0,exercise:Object.keys(saved.exercises).length}}
function head(eyebrow,title,desc){return `<div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-lead">${esc(desc)}</p>`}
function navButton(page,icon,title){return `<button data-action="page" data-page="${page}" class="${ui.page===page?'active':''}"><span class="mark">${icon}</span>${title}</button>`}
function shell(inner){const s=stats();document.getElementById('app').innerHTML=`<div class="mobile-header"><strong>СЕМЁН ЧАЙКА<span style="color:var(--warm)">.</span></strong><div class="mobile-nav"><button data-action="page" data-page="home" class="${ui.page==='home'?'active':''}" aria-label="Главная">⌂</button><button data-action="page" data-page="library" class="${ui.page==='library'?'active':''}">Ситуации</button><button data-action="page" data-page="ai" class="${ui.page==='ai'?'active':''}">ИИ</button><button data-action="page" data-page="practice" class="${ui.page==='practice'?'active':''}">Практика</button><button data-action="page" data-page="progress" class="${ui.page==='progress'?'active':''}">Прогресс</button></div></div><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-tag">ИНТЕРАКТИВНЫЙ КУРС</div><div class="brand-name">ЛИЧНЫЕ<br>ГРАНИЦЫ<span>.</span></div><div style="font-size:12px;color:#d7b7af;margin-top:13px;font-weight:700">СЕМЁН ЧАЙКА</div></div><nav class="nav" aria-label="Основная навигация">${navButton('home','⌂','Главная')}${navButton('library','▦','Ситуации')}${navButton('ai','✦','ИИ-собеседник')}${navButton('practice','◎','Практика')}${navButton('progress','▥','Мой прогресс')}${navButton('guide','◇','Методика')}</nav><div class="side-bottom"><strong>30 ситуаций. 90 раундов.</strong><br>Базовые задания доступны без интернета.<br><br>ИИ-диалог работает при подключении сервера.</div></aside><main class="main"><header class="top"><span class="eyebrow">ИНТЕРАКТИВНЫЙ КУРС ПО ЛИЧНЫМ ГРАНИЦАМ ОТ СЕМЁНА ЧАЙКИ</span><div class="row-between"><span class="micro">Освоено ${s.n} из 30</span><div class="round">НЕТ</div></div></header>${inner}<footer class="footer"><span>© Семён Чайка · Интерактивный курс по личным границам</span><span>Разборы учебные, реакции собеседников смоделированы.</span></footer></main></div>`}
function card(s){const rec=saved.records[s.id];return `<article class="scenario-card"><div class="row-between"><span class="pill">${cIcon(s.category)} ${esc(s.category)}</span>${rec?'<span class="badge-check">✓ пройдено</span>':`<span class="level">${'●'.repeat(s.level)}${'○'.repeat(3-s.level)}</span>`}</div><h3>${esc(s.title)}</h3><p>${esc(s.scene)}</p><button class="btn ${rec?'btn-ghost':'btn-dark'} btn-small" data-action="start" data-id="${s.id}">${rec?'Пройти снова ↗':'Начать диалог ↗'}</button><button class="btn btn-outline btn-small" data-action="ai-start" data-id="${s.id}">✦ Свой ответ с ИИ</button></article>`}
function home(){const s=stats();const feature=SCENARIOS.filter(x=>!saved.records[x.id]).slice(0,3);return `<section class="hero"><div><div class="sup">Не оправдывайся. Выбирай сам.</div><h1>ТВОЁ «НЕТ»<br><span>ИМЕЕТ ЗНАЧЕНИЕ.</span></h1><p>30 реальных по духу ситуаций, три раунда давления в каждой, разбор твоих решений и упражнения на уверенный отказ.</p><button class="btn btn-primary" data-action="start" data-id="${feature[0]?.id||1}">Начать тренировку <span aria-hidden="true">↗</span></button> <button class="btn btn-outline" data-action="page" data-page="ai" style="background:#ffffff13;color:white;border-color:#ffffff70;margin-top:8px">✦ Диалог с ИИ</button></div><div class="hero-art" aria-hidden="true"><div class="art-ring"></div><div class="art-stop">НЕТ.</div><div class="art-chat a">Ты же не откажешь?</div><div class="art-chat b">Решение за мной.</div></div></section><div class="stat-grid"><div class="stat"><div class="stat-value">${s.n}<span style="color:#9faaa9;font-size:18px"> / 30</span></div><div class="stat-label">Ситуаций пройдено</div></div><div class="stat"><div class="stat-value">${s.choices}</div><div class="stat-label">Решений принято</div></div><div class="stat"><div class="stat-value">${s.exercise}<span style="color:#9faaa9;font-size:18px"> / 4</span></div><div class="stat-label">Упражнений сделано</div></div></div><section class="section"><div class="section-head"><div><h2>Выбери сферу общения</h2><p>По пять ситуаций в каждом направлении.</p></div><button class="plain-link" data-action="page" data-page="library">Все 30 ↗</button></div><div class="card-grid">${CATEGORIES.map(c=>`<button class="category-card" data-action="category" data-cat="${esc(c.name)}"><div class="cat-icon">${c.icon}</div><h3>${esc(c.name)}</h3><p>${esc(c.desc)} · ${catCount(c.name)} ситуаций</p></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><h2>С чего начать</h2><p>Короткие тренировочные диалоги, по 5–7 минут.</p></div></div><div class="card-grid">${(feature.length?feature:SCENARIOS.slice(0,3)).map(card).join('')}</div></section><section class="section"><div class="section-head"><div><h2>Как устроен тренажёр</h2></div></div><div class="steps-grid"><div class="step-card"><span class="step-number">01</span><h3>Услышь давление</h3><p>Собеседник произносит неприятную просьбу или упрёк.</p></div><div class="step-card"><span class="step-number">02</span><h3>Выбери ответ</h3><p>Три варианта с разными последствиями. После ответа давление усиливается.</p></div><div class="step-card"><span class="step-number">03</span><h3>Разбери и повтори</h3><p>Получай конкретный разбор и тренируй собственную фразу.</p></div></div><div class="sticky-actions"><button class="btn btn-outline btn-small" data-action="page" data-page="guide">Узнать методику →</button></div></section>`}
function library(){const filtered=SCENARIOS.filter(s=>(ui.category==='Все'||s.category===ui.category)&&(ui.level==='Все'||s.level===Number(ui.level))&&(`${s.title} ${s.scene} ${s.category}`.toLocaleLowerCase('ru').includes(ui.query.toLocaleLowerCase('ru'))));return `${head('БИБЛИОТЕКА СИТУАЦИЙ','30 разговоров, в которых трудно отказать','Выбери знакомую ситуацию. В каждом кейсе три раунда давления, варианты ответов и персональный разбор.') }<div class="toolbar"><input class="search" type="search" id="scenario-search" value="${esc(ui.query)}" placeholder="Поиск по ситуациям" aria-label="Поиск по ситуациям"><div class="row-between"><label class="small muted" for="level-filter">Сложность</label><select id="level-filter" class="search" style="min-width:140px;max-width:150px"><option value="Все" ${ui.level==='Все'?'selected':''}>Любая</option><option value="1" ${ui.level==='1'?'selected':''}>Низкая</option><option value="2" ${ui.level==='2'?'selected':''}>Средняя</option><option value="3" ${ui.level==='3'?'selected':''}>Высокая</option></select></div></div><div class="filters"><button class="filter ${ui.category==='Все'?'active':''}" data-action="category" data-cat="Все">Все</button>${CATEGORIES.map(c=>`<button class="filter ${ui.category===c.name?'active':''}" data-action="category" data-cat="${esc(c.name)}">${c.icon} ${esc(c.name)}</button>`).join('')}</div><div class="row-between" style="margin:0 0 15px"><span class="muted small">Найдено: ${filtered.length}</span><span class="muted small">● низкая · ●● средняя · ●●● высокая</span></div>${filtered.length?`<div class="scenario-list">${filtered.map(card).join('')}</div>`:'<div class="empty">Нет ситуаций по этому запросу. Попробуй другой фильтр.</div>'}`}
function optionsFor(s,round){const firm=s.assertive[round];const avoid=['Ладно, сделаю, как ты просишь. Не хочу спорить.','Хорошо, уговорили. Хотя мне это не подходит.','Ладно, пусть будет по-твоему, только без спора.'][round];const fight=['Да сколько можно? Отстань уже от меня!','Хватит на меня давить! Ты вообще слышишь себя?','Всё, замолчи! С тобой бесполезно разговаривать.'][round];const map={firm:{style:'firm',text:firm},avoid:{style:'avoid',text:avoid},fight:{style:'fight',text:fight}};const rotations=[['avoid','firm','fight'],['fight','avoid','firm'],['firm','fight','avoid']];return rotations[(s.id+round)%3].map(x=>map[x])}
function approach(style){if(style==='firm')return {title:'Чёткая граница',color:'#247b6d',explanation:'Ты обозначил решение без нападения и не стал оправдываться. Это тренирует ясный, уважительный отказ.',reaction:'Мне не нравится такой ответ, но я понял твою позицию.'};if(style==='avoid')return {title:'Уступка под давлением',color:'#af7a34',explanation:'Ты отложил собственное решение ради спокойствия собеседника. В реальной жизни уступка бывает осознанным выбором, но здесь она появилась из-за давления.',reaction:'Спасибо! Отлично, значит мы договорились.'};return {title:'Отказ через конфликт',color:'#c35a4b',explanation:'Ты остановил просьбу, но добавил нападение. Это может усилить спор и отвлечь от самой границы. Иногда при угрозе важнее безопасность, а не вежливость.',reaction:'Почему столько грубости? Я ведь просто обратился с просьбой.'}}
function nextLine(s,round){let line=s.prompts[round];if(round===0)return line;const prev=ui.choices[round-1]?.style;const prefix=prev==='firm'?'Я услышал отказ. Но ':prev==='avoid'?'Раз ты уже согласился, давай обсудим ещё одно. ':'Не обязательно так резко. Всё-таки ';return prefix+line.charAt(0).toLowerCase()+line.slice(1)}
function training(){const s=scenario(ui.scenario);if(!s)return library();if(ui.round>=3)return results();const opt=optionsFor(s,ui.round);const picked=ui.choices[ui.round];const info=picked?approach(picked.style):null;return `<button class="plain-link" data-action="page" data-page="library">← Все ситуации</button><div class="round-top" style="margin-top:18px"><div><span class="pill">${cIcon(s.category)} ${esc(s.category)}</span> <span class="level">${'●'.repeat(s.level)}${'○'.repeat(3-s.level)}</span></div><div class="rounds" aria-label="Раунд ${ui.round+1} из 3">${[0,1,2].map(n=>`<b class="${n<ui.round?'done':n===ui.round?'current':''}"></b>`).join('')}</div></div><h1 class="page-title">${esc(s.title)}</h1><p class="page-lead" style="margin-bottom:18px">Раунд ${ui.round+1} из 3. Собеседник продолжает давить. Выбери ответ, который считаешь подходящим.</p><div class="two-col"><div><div class="stage-card"><div class="role">${esc(s.speaker)} говорит</div><div class="scene">${esc(s.scene)}</div><div class="speech">«${esc(nextLine(s,ui.round))}»</div></div><div class="section-head" style="margin-top:24px"><h2 style="font-size:20px">Как ты ответишь?</h2><span class="muted small">Выбери реплику</span></div><div class="choice-list">${opt.map((o,i)=>`<button class="choice ${picked?.style===o.style?'selected':''}" data-action="choose" data-style="${o.style}" ${picked?'disabled':''}><span class="letter">${'АБВ'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div>${picked?`<div class="feedback" aria-live="polite"><div class="eyebrow">РАЗБОР ОТВЕТА</div><div class="feedback-title" style="color:${info.color}">${info.title}</div><p>${info.explanation}</p><div class="reaction">Возможная реакция: «${esc(info.reaction)}»</div><p><b>Более уверенная формулировка:</b></p><div class="goodphrase">«${esc(s.assertive[ui.round])}»</div><div class="sticky-actions"><button class="btn btn-primary" data-action="next">${ui.round===2?'Завершить и увидеть разбор →':'Следующий раунд →'}</button><button class="btn btn-ghost btn-small" data-action="copy" data-copy="${esc(s.assertive[ui.round])}">Скопировать фразу</button></div></div>`:'<p class="muted small">Здесь нет задачи угадать «правильную» кнопку. Важно заметить собственную реакцию на давление и её возможные последствия.</p>'}</div><aside class="coach-aside"><div class="eyebrow">ПОДСКАЗКА ТРЕНЕРА</div><h3 style="margin-top:12px">Твоя цель: спокойная граница</h3><p>В ответе попробуй совместить три элемента:</p><ul><li>Понятное решение: да или нет</li><li>Уважение к собеседнику</li><li>Отсутствие лишних оправданий</li></ul><div class="divider"></div><h3>Контекст имеет значение</h3><p>Границы не всегда требуют мягкости. Если ситуация небезопасна или есть угроза, приоритет - защита и обращение за помощью.</p></aside></div>`}
function resultCalc(choices){let n=choices.length,firm=choices.filter(x=>x.style==='firm').length,avoid=choices.filter(x=>x.style==='avoid').length,fight=choices.filter(x=>x.style==='fight').length;return {firm,avoid,fight,clarity:Math.round((firm*2+fight*2)/(n*2)*100),respect:Math.round((firm*2+avoid*2)/(n*2)*100),consistency:Math.round(firm/n*100)}}
function results(){const s=scenario(ui.scenario);const a=resultCalc(ui.choices);const key=String(s.id);const note=saved.notes[key]||'';const h=a.firm===3?'Ты удержал границу во всех трёх раундах':a.firm>=2?'Ты несколько раз выбрал уверенный отказ':a.avoid>=2?'Уступка стала твоей привычной реакцией в этой сцене':a.fight>=2?'Отказ прозвучал, но конфликт усилился':'Ты пробовал разные способы отвечать';const next=SCENARIOS.find(x=>x.category===s.category&&!saved.records[x.id]&&x.id!==s.id)||SCENARIOS.find(x=>!saved.records[x.id]&&x.id!==s.id);return `<div class="eyebrow">ЗАВЕРШЕНИЕ ДИАЛОГА</div><div class="result-hero" style="margin-top:12px"><div><div class="eyebrow" style="color:#ffb9aa">${esc(s.title)}</div><h2>${h}</h2><p>Это учебная обратная связь по трём выбранным ответам, а не оценка твоего характера. Ситуации в жизни сложнее готовых сценариев.</p></div><div class="result-number">${a.firm}<span style="font-size:22px;color:#b9c3cb">/3</span></div></div><div class="result-grid"><div class="metric"><strong>${a.firm}/3</strong><span>Уверенные отказы</span></div><div class="metric"><strong>${a.avoid}/3</strong><span>Уступки</span></div><div class="metric"><strong>${a.fight}/3</strong><span>Ответы через конфликт</span></div></div><div class="panel"><h3>Твой профиль ответов</h3><p>Условные тренировочные показатели, рассчитанные только по выбранным репликам.</p>${[['Ясность',a.clarity],['Уважительный тон',a.respect],['Удержание границы',a.consistency]].map(([n,p])=>`<div class="graph-row"><span>${n}</span><div class="score-bar"><span style="width:${p}%"></span></div><b>${p}%</b></div>`).join('')}<div class="divider"></div><h3>Персональный совет</h3><p>${a.avoid>=2?'Попробуй заменить хотя бы одну уступку коротким «нет» без объяснений. Твоя задача - не добиться согласия другого человека, а ясно сказать о своём решении.':a.fight>=2?'Попробуй убирать из отказа оценку личности собеседника. Оставляй саму границу, но исключай обвинение и оскорбление.':a.firm>=2?'Отлично получается сохранять своё решение. Следующий шаг - выдерживать повторное давление, не придумывая каждый раз новую причину.':'В твоих ответах есть и ясность, и колебание. Выбери одну короткую формулировку и попробуй повторить её без изменений.'}</p><div class="goodphrase"><b>Фраза для повторения:</b><br>«${esc(s.assertive[2])}»</div></div><div class="panel"><h3>Твоя заметка</h3><p>Что было сложнее всего в этом разговоре? Запиши собственный вариант отказа. Он останется только в этом браузере.</p><textarea class="textarea" id="reflection" placeholder="Я заметил, что...">${esc(note)}</textarea><button class="btn btn-ghost btn-small" data-action="save-note">Сохранить заметку</button><span id="note-saved" class="small muted" style="margin-left:10px"></span></div><div class="sticky-actions"><button class="btn btn-primary" data-action="start" data-id="${next?.id||s.id}">${next?'Следующая ситуация →':'Пройти ещё раз →'}</button><button class="btn btn-outline" data-action="start" data-id="${s.id}">Повторить этот диалог</button><button class="btn btn-ghost" data-action="page" data-page="progress">Мой прогресс</button></div>`}
const EXERCISES=[{id:'one',icon:'✍️',title:'Отказ в одно предложение',desc:'Потренируй короткое, ясное «нет» без долгих оправданий.'},{id:'two',icon:'✂️',title:'Убери оправдания',desc:'Преврати многословный отказ в спокойную границу.'},{id:'three',icon:'🔁',title:'Заезженная пластинка',desc:'Повтори решение, даже когда давление возвращается.'},{id:'four',icon:'⏸',title:'Право на паузу',desc:'Выбери фразу, которая поможет не отвечать сразу.'}];
function practice(){return `${head('ПРАКТИЧЕСКАЯ МАСТЕРСКАЯ','Слова, которые защищают границы','Четыре коротких упражнения. Здесь можно написать собственную фразу и увидеть подсказку по её форме.') }<div class="exercise-grid">${EXERCISES.map(x=>`<button class="ex-card" data-action="exercise" data-ex="${x.id}"><div class="row-between"><span class="ex-icon">${x.icon}</span>${saved.exercises[x.id]?'<span class="badge-check">✓ выполнено</span>':''}</div><h3>${x.title}</h3><p>${x.desc}</p><span class="plain-link" style="display:inline-block">Открыть упражнение ↗</span></button>`).join('')}</div><div class="notice">Автоматические подсказки к твоему тексту основаны на простых правилах: они не оценивают смысл как человек. Для подробного разбора сложных ситуаций лучше обсуждать контекст отдельно.</div>`}
function oneExercise(){const id=ui.exercise;let body='';if(id==='one')body=`<p>Ситуация: знакомый просит тебя бесплатно поработать в выходной. Ты не хочешь. Напиши отказ одним или двумя предложениями.</p><div class="example">«Можешь в субботу бесплатно помочь с моим проектом? Тебе ведь несложно!»</div><textarea class="textarea" id="practice1" placeholder="Твой ответ..."></textarea><button class="btn btn-primary" data-action="check-practice">Проверить фразу</button>`;
if(id==='two')body=`<p>Убери лишние оправдания из исходной реплики. Сохрани решение, но сократи текст.</p><div class="example">«Прости, пожалуйста, у меня столько всего навалилось, я бы с радостью, но тут планы и дела, наверное, не получится, очень неудобно...»</div><textarea class="textarea" id="practice1" placeholder="Напиши короткий и ясный отказ..."></textarea><button class="btn btn-primary" data-action="check-practice">Проверить фразу</button>`;

function guide(){return `${head('МЕТОДИКА','Коротко. Ясно. Уважительно.','Цель тренажёра - не стать жёстким человеком, а научиться выбирать свои действия без автоматического согласия.') }<div class="panel"><h3>Четыре навыка уверенного отказа</h3>${LESSONS.map((l,i)=>`<div class="guide-item"><div class="guide-initial">${i+1}</div><div><h3>${l.title}</h3><p>${l.description}</p></div></div>`).join('')}</div><div class="panel"><h3>Шаблон в три фразы</h3><div class="example"><b>1.</b> «Спасибо, что спросил».<br><b>2.</b> «Нет, я не смогу это взять».<br><b>3.</b> «Если обстоятельства изменятся, я сам сообщу».</div><p>Третья часть необязательна. Не обещай будущую помощь, если не хочешь её предлагать.</p></div><div class="panel"><h3>Как оцениваются ответы ИИ-тренировки</h3><p>Каждый из трёх критериев оценивается от 0 до 2 баллов в каждом раунде. Это условная, учебная оценка текста, а не личных качеств.</p><p><b>Ясность:</b> 0 — решение не сформулировано; 1 — решение двусмысленно; 2 — решение названо прямо.</p><p><b>Уважительный тон:</b> 0 — нападение или унижение; 1 — резкость без оскорбления; 2 — спокойное уважительное выражение.</p><p><b>Удержание границы:</b> 0 — отказ отменён; 1 — граница ослаблена уступкой; 2 — решение сохраняется.</p><p>Итог рассматривает изменения между тремя ответами. Упражнение подбирается по наименее проявленному навыку, с опорой на одну твою реплику. ИИ может ошибаться: сравни разбор с контекстом.</p></div><div class="panel"><h3>Что означает персональный разбор?</h3><p>Система различает три типа выбранных реплик: ясный отказ, уступка и конфликтный отказ. На основе трёх выборов она формирует статистику и рекомендацию. Она не ставит психологических диагнозов, не читает мысли собеседника и не гарантирует реакций реальных людей.</p><p>В ситуациях с угрозами, преследованием или риском насилия безопасность важнее хорошей формулировки: прерви контакт, обратись за поддержкой к людям, которым доверяешь, или в соответствующие службы.</p></div><button class="btn btn-primary" data-action="page" data-page="library" style="margin-top:18px">Перейти к тренировкам →</button>`}

async function aiSend(){if(ui.aiBusy||ui.aiHistory.length>=3||ui.aiStatus!=='ready')return;if(ui.aiRemaining===0){ui.aiError='На сегодня все ответы ИИ использованы. Новые диалоги будут доступны завтра. Пока попробуй обычные упражнения.';render();return;}const text=(document.getElementById('ai-response')?.value||ui.aiDraft||'').trim();if(!ui.aiConsent){ui.aiError='Сначала подтверди согласие на отправку учебных реплик в Google Gemini.';ui.aiDraft=text;render();return}if(text.length<1||text.length>600){ui.aiError='Напиши ответ длиной от 1 до 600 символов.';ui.aiDraft=text;render();return}

 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario_id:scenarioId,round:history.length+1,message:text,history,consent:true})});const data=await r.json().catch(()=>({}));if(!r.ok){if(r.status===429&&data.remaining===0)ui.aiRemaining=0;throw Error(data.error||'Не удалось получить ответ.')}if(Number.isInteger(data.daily_remaining))ui.aiRemaining=data.daily_remaining;if(Number.isInteger(data.daily_limit))ui.aiDailyLimit=data.daily_limit;if(ui.aiScenario!==scenarioId||ui.page!=='ai-chat')return;ui.aiHistory.push({user:text,reply:data.reaction,feedback:data.feedback,rewrite:data.rewrite,signals:data.signals});ui.aiDraft='';ui.aiBusy=false;ui.aiLast=data;if(ui.aiHistory.length>=3){saved.aiSessions[scenarioId]={history:ui.aiHistory,summary:data.final_summary||'Три ответа завершены. Посмотри разбор каждого раунда.',exercise:data.next_practice||'Повтори одну уверенную фразу завтра.',time:Date.now()};save();ui.page='ai-done'}render();requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}

function practiceCheck(idx=null){const id=ui.exercise;if(id==='four'){const good=idx===1;ui.practiceFeedback={good,title:good?'Удачная пауза':'Попробуй другой вариант',body:good?'Ты не обещаешь согласие и называешь понятный срок ответа. Пауза - полноценное решение.':idx===0?'Согласие, данное из-за спешки, может не соответствовать твоим интересам. Ты вправе подумать.':'Резкий выпад усиливает конфликт. Можно попросить время без обвинений.'};if(good){saved.exercises[id]={done:Date.now()};save()}render();return}
const a=(document.getElementById('practice1')?.value||'').trim();const b=(document.getElementById('practice2')?.value||'').trim();if(!a||(id==='three'&&!b)){ui.practiceFeedback={good:false,title:'Напиши свой вариант',body:'Здесь нет одного единственного правильного ответа. Сначала попробуй сформулировать фразу самостоятельно.'};render();return}
const isBoundary=t=>/((?:^|[^а-яё])нет(?:$|[^а-яё])|не\s+(?:могу|смогу|буду|хочу|готов|планирую|согласен|возьму|дам|стану|получится)|отказываюсь|сегодня\s+не|мне\s+не\s+подходит)/i.test(t);
const hasApology=t=>(t.match(/извин|прости|виноват|простите|пожалуйста/gi)||[]).length>1;
let good=false,title='',body='';
if(id==='one'){good=isBoundary(a)&&a.length<220;title=good?'Граница звучит достаточно ясно':'Можно сделать отказ чётче';body=good?'В твоей фразе обнаружено прямое обозначение отказа. Проверь также интонацию: она может оставаться спокойной.':'Попробуй начать с «Нет, я не смогу помочь в субботу». Избегай формулировок вроде «может быть» и длинных цепочек причин.';if(hasApology(a))body+=' Много извинений могут ослаблять уверенность, хотя извинение само по себе не ошибка.'}
if(id==='two'){good=isBoundary(a)&&a.length<130;title=good?'Получился компактный отказ':'Сократи ещё немного';body=good?'Ты сохранил решение и заметно сократил текст. Посмотри, не осталось ли в нём обещаний, которых ты не собираешься выполнять.':'Попробуй оставить одно решение без истории о причинах. Например: «Нет, сегодня я не смогу».'}
if(id==='three'){good=isBoundary(a)&&isBoundary(b);title=good?'Граница повторена':'Граница пока недостаточно ясна';body=good?'Оба ответа содержат явную границу. Важно, чтобы второе сообщение не отменяло первое. Можно даже повторить фразу дословно.':'Сформулируй в обеих репликах один и тот же отказ. Например: «Сегодня я не останусь» и «Понимаю, но сегодня я не останусь».'}
ui.practiceFeedback={good,title,body};if(good){saved.exercises[id]={done:Date.now()};save()};const val1=a,val2=b;render();if(document.getElementById('practice1'))document.getElementById('practice1').value=val1;if(document.getElementById('practice2'))document.getElementById('practice2').value=val2
}
function exportData(){const blob=new Blob([JSON.stringify({course:'Ты же не откажешь. Когда на тебя давят!',exportedAt:new Date().toISOString(),...saved},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='moi-rezultaty-trenazher.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const app=document.getElementById('app');app.addEventListener('click',async event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action;if(act==='page')goto(btn.dataset.page);else if(act==='category'){ui.category=btn.dataset.cat;goto('library')}else if(act==='start')start(btn.dataset.id);else if(act==='ai-start')aiStart(btn.dataset.id);else if(act==='ai-category'){ui.category=btn.dataset.cat;render()}else if(act==='ai-check')checkAiAvailability();else if(act==='ai-send')aiSend();else if(act==='choose')choose(btn.dataset.style);else if(act==='next')next();else if(act==='exercise'){ui.exercise=btn.dataset.ex;goto('exercise')}else if(act==='check-practice')practiceCheck();else if(act==='pause-choice')practiceCheck(Number(btn.dataset.index));else if(act==='save-note'){saved.notes[ui.scenario]=document.getElementById('reflection')?.value||'';save();document.getElementById('note-saved').textContent='Сохранено ✓'}else if(act==='ai-practice-done'){const id=String(ui.aiScenario);saved.exercises['ai-'+id]={done:Date.now(),source:'personalized'};save();render()}else if(act==='export')exportData();else if(act==='reset'){if(confirm('Очистить историю диалогов, упражнения и заметки в этом браузере?')){saved={records:{},exercises:{},notes:{},aiSessions:{}};save();render()}}else if(act==='copy'){try{await navigator.clipboard.writeText(btn.dataset.copy);btn.textContent='Скопировано ✓'}catch{btn.textContent='Выдели и скопируй фразу выше'}}});
app.addEventListener('input',e=>{if(e.target.id==='scenario-search'){const start=e.target.selectionStart;ui.query=e.target.value;const list=document.querySelector('.scenario-list');const next=library();const parser=new DOMParser().parseFromString(next,'text/html');const newList=parser.querySelector('.scenario-list');const oldList=document.querySelector('.scenario-list');if(oldList&&newList)oldList.replaceWith(newList);else{const wrapper=document.querySelector('.scenario-list,.empty');if(wrapper)wrapper.outerHTML=newList?.outerHTML||'<div class="empty">Нет ситуаций по этому запросу.</div>'}const num=document.querySelector('.toolbar+.filters+.row-between .small');if(num)num.textContent='Найдено: '+SCENARIOS.filter(s=>(ui.category==='Все'||s.category===ui.category)&&(ui.level==='Все'||s.level===Number(ui.level))&&(`${s.title} ${s.scene} ${s.category}`.toLocaleLowerCase('ru').includes(ui.query.toLocaleLowerCase('ru')))).length}});
app.addEventListener('keydown',e=>{if(e.target.id==='ai-response'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();aiSend()}});
app.addEventListener('input',e=>{if(e.target.id==='ai-response')ui.aiDraft=e.target.value});
app.addEventListener('change',e=>{if(e.target.id==='level-filter'){ui.level=e.target.value;render()}else if(e.target.id==='ai-consent'){ui.aiConsent=e.target.checked}});
render();
</script></body></html>
