name: One-time public launch audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-audit.yml'

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deployed course, actual Gemini dialogue, quota and WAF
        run: python tests/live_audit.py
