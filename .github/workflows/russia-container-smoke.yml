name: Russian hosting container smoke
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app.py'
      - 'ai_server.py'
      - 'paid_access.py'
      - 'paid_routes.py'
      - 'yandex_provider.py'
      - '.github/workflows/russia-container-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t boundaries-course-ru:smoke .
      - name: Start server with fake Yandex credentials
        run: |
          docker run -d --name boundaries-course-ru-smoke -p 127.0.0.1:18080:8080 \
            -e AI_PROVIDER=yandex -e YANDEX_API_KEY=dummy-not-real \
            -e YANDEX_FOLDER_ID=dummy-folder -e PAYWALL_ENABLED=0 \
            boundaries-course-ru:smoke
      - name: Verify server, course and provider selection without paid API calls
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/healthz -o /tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:18080/ -o /tmp/course.html
          curl -fsS --max-time 5 http://127.0.0.1:18080/api/status -o /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/health.json').read_text())['ok']
          page = Path('/tmp/course.html').read_text()
          assert 'ЛИЧНЫЕ' in page and 'ГРАНИЦЫ' in page
          status = json.loads(Path('/tmp/status.json').read_text())
          assert status['provider'] == 'yandex', status
          assert status['daily_limit'] == 18, status
          print('RUSSIAN_CONTAINER_SMOKE PASS: health, course page, Yandex selection, free-mode quota')
          PY
      - name: Stop container
        if: always()
        run: docker rm -f boundaries-course-ru-smoke || true
