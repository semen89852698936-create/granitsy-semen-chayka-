name: Check SNAChALA UZHIN preview
on:
  push:
    branches: [snachala-uzhin-site]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live website
        run: |
          set -euo pipefail
          URL="https://snachala-uzhin-preview-chaika2.vercel.app"
          curl --fail --show-error --silent --location --max-time 30 "$URL" -o /tmp/su.html
          echo "HTTP payload size: $(wc -c </tmp/su.html)"
          head -c 150 /tmp/su.html
          echo
          test "$(wc -c </tmp/su.html)" -gt 20000
          grep -q "Сначала ужин" /tmp/su.html
          grep -q "1001 повод" /tmp/su.html
          grep -q "function stepsNoun(n)" /tmp/su.html
          grep -q "stepsNoun(r.steps.length)" /tmp/su.html
          grep -q 'class="du-wine-glass"' /tmp/su.html
          grep -q 'font-size:21px;line-height:1.65' /tmp/su.html
          grep -q 'font-size:20px;line-height:1.6' /tmp/su.html
          curl --fail --show-error --silent --location --max-time 30 "$URL/favicon.svg" -o /tmp/favicon.svg
          grep -q '<svg' /tmp/favicon.svg
          grep -q '#b77d92' /tmp/favicon.svg
          echo "PUBLIC SITE AND NEW FONT SIZES + WINEGLASS VERIFIED"
