name: Course regression checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py ai_server.py course_quality.py paid_access.py paid_routes.py
      - run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'site_template.html', 'paywall.html'):
              source = Path(name).read_text('utf-8')
              inline = source.split('<script>', 1)[1].split('</script>', 1)[0]
              Path('/tmp/' + name + '.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/site_template.html.js
          node --check /tmp/paywall.html.js
