services:
  - type: web
    name: granitsy-semen-chayka
    runtime: python
    plan: free
    buildCommand: "python -m compileall -q ai_server.py"
    startCommand: "python ai_server.py"
    healthCheckPath: /api/status
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: HOST
        value: 0.0.0.0
      - key: RATE_LIMIT_PER_10_MIN
        value: "15"
